<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf2">
  <meta name="description" content="Map of cat sightings in Malaysia.">
  <title>ManaMeow · Malaysia’s cat map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e97a4e'/%3E%3Cg fill='%23fffaf2'%3E%3Cellipse cx='32' cy='39' rx='12' ry='10'/%3E%3Cellipse cx='19' cy='29' rx='5' ry='7' transform='rotate(-25 19 29)'/%3E%3Cellipse cx='28' cy='21' rx='5' ry='7'/%3E%3Cellipse cx='38' cy='22' rx='5' ry='7'/%3E%3Cellipse cx='46' cy='31' rx='5' ry='7' transform='rotate(25 46 31)'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="geo-map.css?v=2">
  <link rel="stylesheet" href="styles.css?v=2">
  <script defer src="geo-map.js?v=2"></script>
  <script defer src="app.js?v=2"></script>
</head>
<body>
  <a class="skip" href="#map" data-i="skip">Skip to the map</a>
  <main class="map-app" aria-label="ManaMeow">
    <div id="map" tabindex="-1" data-label="mapLabel" aria-label="Cat sightings map"></div>

    <header class="map-toolbar">
      <div class="toolbar-group">
        <div class="brand" aria-label="ManaMeow">
          <span class="brand-mark"><span class="paw" aria-hidden="true"></span></span>
          <span class="wordmark">Mana<span class="brand-accent">Meow</span></span>
        </div>
        <button class="map-button search-toggle" type="button" id="search-toggle" popovertarget="search-panel" data-label="findCats" aria-label="Find cats">
          <span class="magnify" aria-hidden="true"></span><span class="search-label" data-i="findCats">Find cats</span>
        </button>
      </div>
      <div class="toolbar-group">
        <button type="button" class="map-button primary add-cat" id="add-cat" data-label="add" aria-label="Add a cat">
          <span class="add-icon" aria-hidden="true">+</span><span class="add-label" data-i="add">Add a cat</span>
        </button>
        <button class="map-button icon-button settings-toggle" type="button" popovertarget="settings-panel" data-label="menu" aria-label="Menu"><span aria-hidden="true"></span></button>
      </div>
    </header>

    <section id="search-panel" class="map-panel search-panel" popover data-label="findCats" aria-label="Find cats">
      <label class="search">
        <span class="magnify" aria-hidden="true"></span>
        <input type="search" id="cat-search" data-placeholder="search" data-label="search" placeholder="Cat name, city or place" aria-label="Cat name, city or place" autofocus>
      </label>
      <div class="filters" data-label="filter" role="group" aria-label="Cat category">
        <button type="button" data-category="all" aria-pressed="true" data-i="all">All</button>
        <button type="button" data-category="stray" aria-pressed="false" data-i="stray">Stray</button>
        <button type="button" data-category="pet" aria-pressed="false" data-i="pet">Pet</button>
        <button type="button" data-category="cafe" aria-pressed="false" data-i="cafe">Café</button>
      </div>
      <ul id="cat-list" class="cat-list"></ul>
      <p id="search-empty" class="fallback" data-i="noMatches" role="status" hidden>No matching cats.</p>
    </section>

    <section id="settings-panel" class="map-panel settings-panel" popover data-label="menu" aria-label="Menu">
      <button type="button" id="account" data-i="account">My account</button>
      <label class="language-row"><span data-i="language">Language</span>
        <select id="lang" class="language">
          <option value="en">English</option><option value="zh">简体中文</option><option value="ms">Bahasa Melayu</option>
        </select>
      </label>
    </section>

    <div id="map-instruction" class="map-instruction" hidden>
      <span data-i="pick">Tap the map to place a pin.</span>
      <button type="button" class="text-button" id="cancel-pick" data-i="cancel">Cancel</button>
    </div>
    <div class="map-tools" data-label="mapControls" aria-label="Map controls">
      <button type="button" id="zoom-in" data-label="zoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" data-label="zoomOut" aria-label="Zoom out">−</button>
      <button type="button" id="reset-map" data-label="resetMap" aria-label="Reset map view">◎</button>
    </div>
    <noscript><p class="map-instruction">Enable JavaScript to open the map.</p></noscript>
  </main>

  <dialog id="cat-dialog" aria-labelledby="cat-title">
    <button class="close" type="button" data-close aria-label="Close">×</button>
    <img id="cat-image" class="profile-image" alt="" width="480" height="265" hidden>
    <div class="dialog-body">
      <span id="cat-category" class="badge"></span>
      <h2 id="cat-title"></h2>
      <p id="cat-location" class="profile-location"></p>
      <p id="cat-note"></p>
      <p id="cat-date" class="fine"></p>
      <p id="cat-demo" class="fine" data-i="profileDemo">Illustrative photo and approximate sample location.</p>
    </div>
  </dialog>
  <dialog id="account-dialog" aria-labelledby="account-title">
    <button class="close" type="button" data-close aria-label="Close">×</button>
    <div class="dialog-body">
      <h2 id="account-title" data-i="account">My account</h2>
      <p id="account-message"></p>
      <div id="account-links" class="dialog-actions"></div>
      <ul id="my-sightings" class="my-sightings"></ul>
    </div>
  </dialog>
  <dialog id="upload-dialog" aria-labelledby="upload-title">
    <button class="close" type="button" data-close aria-label="Close">×</button>
    <div class="dialog-body">
      <h2 id="upload-title" data-i="add">Add a cat</h2>
      <p id="upload-mode"></p>
      <form id="sighting-form">
        <label><span data-i="name">Cat name</span><input name="name" maxlength="48" required autofocus data-placeholder="nameExample" placeholder="e.g. Milo"></label>
        <div class="form-grid">
          <label><span data-i="category">Category</span><select name="category"><option value="stray" data-i="stray">Stray</option><option value="pet" data-i="pet">Pet</option><option value="cafe" data-i="cafe">Café</option></select></label>
          <label><span data-i="city">City or town</span><input name="city" maxlength="70" required data-placeholder="cityExample" placeholder="e.g. Ipoh"></label>
        </div>
        <label><span data-i="around">Nearby public landmark</span><input name="location" maxlength="100" required data-placeholder="placeExample" placeholder="e.g. Near the town garden"></label>
        <div class="pin-row">
          <button class="button secondary" type="button" id="pick-location" data-i="selectPin">Choose a map pin</button>
          <span id="pin-status" class="fine" data-i="pinNone">No pin selected</span>
        </div>
        <label><span data-i="observed">Date spotted</span><input name="observed" type="date" required></label>
        <label><span data-i="photo">Photo</span><input name="image" type="file" accept="image/jpeg,image/png,image/webp"><small data-i="photoHelp">JPG, PNG or WebP, up to 10 MB. Choose a photo you have permission to share.</small></label>
        <label><span data-i="note">Notes (optional)</span><textarea name="note" rows="3" maxlength="450" data-placeholder="noteExample" placeholder="What would help others recognise this cat?"></textarea></label>
        <p id="upload-error" class="error" role="alert" hidden></p>
        <div class="dialog-actions"><button class="button primary" type="submit" id="submit-sighting" data-i="submit">Submit for review</button></div>
      </form>
    </div>
  </dialog>
  <p id="toast" class="toast" role="status" hidden></p>
</body>
</html>
